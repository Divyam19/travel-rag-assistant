[project]
name = "travelrag"
version = "0.1.0"
description = "Hybrid agentic RAG chatbot for travel news"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "openai>=1.50",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "tiktoken>=0.7",
    "tavily-python>=0.7",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
