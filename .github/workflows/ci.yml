name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Nothing in this workflow needs to write to the repo, and pull requests from forks
# never receive repository secrets.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Settings validates these at import time. The values are dummies: no test calls OpenAI or
      # Tavily, and the database is deliberately unreachable so the two tests that need a real
      # Postgres skip instead of failing.
      OPENAI_API_KEY: sk-ci-dummy
      TAVILY_API_KEY: tvly-ci-dummy
      SUPABASE_DB_URL: postgresql://ci:ci@127.0.0.1:1/ci
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.tiktoken
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: .tiktoken
          key: tiktoken-cl100k
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
